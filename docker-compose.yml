services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: personal-website-frontend
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  frontend_node_modules:
